name: Agent Coordinator Verification

on:
  push:
    branches: [master, "wave-1/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: coordinator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-quick-ci.yml@a6085dae73bb80e91b845fd4a0d2f73a9c6b985a
    with:
      repo_name: ${{ github.event.repository.name }}-py${{ matrix.python-version }}
      language: python
      strict: true
      verify_script: scripts/ci/verify.sh
      python_version: ${{ matrix.python-version }}
      upload_artifacts: true
