[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "anthropic-agent-coordinator"
version = "1.0.0"
description = "Deterministic dependency-aware specialist scheduling under global and aggregate role budgets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Casey Barton" }]
keywords = ["agents", "orchestration", "scheduling", "budgets", "dependency-graph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
agent-coordinate = "anthropic_agent_coordinator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anthropic_agent_coordinator"]

[tool.hatch.build.targets.wheel.force-include]
"src/coordinator.py" = "coordinator.py"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["anthropic_agent_coordinator", "scripts"]
